<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DECOM · Administración</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
  body{margin:0;padding:16px;background:#111;color:#eee;font-family:Arial,sans-serif;max-width:760px;margin-inline:auto}
  h1{font-size:20px;margin:4px 0 12px}
  #msg{color:#f5b942;margin:12px 0}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;padding:10px;border:0;border-radius:8px;background:#2a2a2a;color:#ddd;cursor:pointer}
  .tabs button.on{background:#0077cc;color:#fff}
  .card{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:14px}
  .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#aaa;margin-bottom:8px}
  .badge{background:#7a1f1f;color:#fff;border-radius:10px;padding:2px 8px;font-size:12px;white-space:nowrap}
  .badge.ok{background:#1f5c2e}.badge.no{background:#444}.badge.ban{background:#8a1f4b}
  .contenido{background:#111;border-radius:8px;padding:10px;margin:8px 0;word-break:break-word}
  .contenido img{max-width:100%;max-height:280px;border-radius:8px;display:block;margin-top:8px}
  .motivos{font-size:13px;color:#ccc;margin:6px 0}
  .acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .acciones button{flex:1;min-width:130px;padding:10px;border:0;border-radius:8px;color:#fff;cursor:pointer;font-size:14px}
  .b-borrar{background:#b3261e}.b-ban{background:#8a4b00}.b-desc{background:#444}.b-unban{background:#1f6b3a}.b-reabrir{background:#2f5f8f}.b-todo{background:#6b1010}
  #buscar{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #444;background:#1c1c1c;color:#eee;margin-bottom:12px;font-size:15px}
  .sub{font-size:12px;color:#888;margin-top:2px}
  a{color:#6db3f2}
</style>
</head>
<body>
<h1>Panel de administración</h1>
<div id="msg">Cargando…</div>
<div class="tabs">
  <button data-e="pendiente" class="on">Pendientes</button>
  <button data-e="todas">Todas</button>
  <button data-e="usuarios">Usuarios</button>
</div>
<input id="buscar" type="search" placeholder="Buscar usuario por nombre o correo…" style="display:none">
<div id="lista"></div>

<script>
(function(){
  var sb = supabaseClient, $ = function(s){return document.querySelector(s)}, filtro = 'pendiente', tBuscar;
  function msg(t){ $('#msg').textContent = t || ''; }
  function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }

  async function init(){
    var s = await sb.auth.getSession();
    if(!s.data || !s.data.session){ msg('Primero inicia sesión en la app (en esta misma dirección web) y vuelve a abrir esta página.'); return; }
    var a = await sb.rpc('es_admin');
    if(a.error || a.data !== true){ msg('Esta cuenta no es administradora.'); return; }
    document.querySelectorAll('.tabs button').forEach(function(b){
      b.onclick = function(){
        filtro = b.dataset.e;
        document.querySelectorAll('.tabs button').forEach(function(x){ x.classList.toggle('on', x === b); });
        $('#buscar').style.display = filtro === 'usuarios' ? 'block' : 'none';
        recargar();
      };
    });
    $('#buscar').addEventListener('input', function(){ clearTimeout(tBuscar); tBuscar = setTimeout(cargarUsuarios, 350); });
    recargar();
  }
  function recargar(){ if(filtro === 'usuarios') cargarUsuarios(); else cargar(); }

  /* ---------- acciones compartidas ---------- */
  async function miCorreo(){
    var ses = await sb.auth.getSession();
    return ((ses.data && ses.data.session && ses.data.session.user.email) || '').toLowerCase();
  }
  async function bloquear(correo, valor){
    var yo = await miCorreo();
    if(valor && String(correo).toLowerCase() === yo){ alert('No puedes bloquearte a ti mismo'); return false; }
    var txt = valor ? '¿Bloquear el acceso de ' + correo + '? Podrás revertirlo.' : '¿Desbloquear a ' + correo + '?';
    if(!confirm(txt)) return false;
    var r = await sb.rpc('admin_bloquear_usuario', {p_correo: correo, p_bloquear: valor});
    if(r.error){ alert('Error: ' + r.error.message); return false; }
    return true;
  }
  async function borrarTodo(correo){
    var yo = await miCorreo();
    if(String(correo).toLowerCase() === yo){ alert('No puedes borrar tu propio contenido desde aquí'); return false; }
    if(!confirm('¿Borrar TODAS las publicaciones, comentarios, "me gusta" y notificaciones de ' + correo + '? No se puede deshacer.')) return false;
    var t = prompt('Para confirmar, escribe el correo completo:');
    if(t === null || t.trim().toLowerCase() !== String(correo).toLowerCase()){ alert('Cancelado'); return false; }
    var r = await sb.rpc('admin_borrar_todo_de_usuario', {p_correo: correo});
    if(r.error){ alert('Error: ' + r.error.message + '\n(¿ya ejecutaste el SQL de admin_borrar_todo_de_usuario?)'); return false; }
    alert('Listo: ' + JSON.stringify(r.data)); return true;
  }

  /* ---------- pestaña Usuarios ---------- */
  function estaBloqueado(u){
    var k = ['bloqueado','bloqueada','suspendido','baneado','is_blocked','blocked','banned'];
    for(var i = 0; i < k.length; i++){ if(k[i] in u) return u[k[i]] === true; }
    if('estado' in u) return /bloq|susp|ban/i.test(String(u.estado || ''));
    return null;
  }
  async function cargarUsuarios(){
    msg('Cargando…'); $('#lista').textContent = '';
    var q = sb.from('usuarios').select('*').limit(50);
    var t = $('#buscar').value.trim().replace(/[%,()]/g, '');
    if(t) q = q.or('nombre.ilike.%' + t + '%,correo.ilike.%' + t + '%');
    var r = await q;
    if(r.error){ msg('Error: ' + r.error.message); return; }
    var us = r.data || [];
    var rb = await sb.rpc('admin_correos_bloqueados'), bloqueados = null;
    if(!rb.error) bloqueados = (rb.data || []).map(function(x){ return String(x).toLowerCase(); });
    msg(us.length ? '' : 'No se encontraron usuarios.');
    us.forEach(function(u){
      var card = el('div', 'card'), top = el('div', 'top');
      var info = el('div'); info.appendChild(el('b', '', u.nombre || '(sin nombre)')); info.appendChild(el('div', 'sub', u.correo || ''));
      top.appendChild(info);
      var b = bloqueados ? bloqueados.indexOf(String(u.correo || '').toLowerCase()) >= 0 : estaBloqueado(u);
      if(b === true) top.appendChild(el('span', 'badge ban', 'bloqueado'));
      else if(b === false) top.appendChild(el('span', 'badge ok', 'activo'));
      card.appendChild(top);
      var ac = el('div', 'acciones');
      var bb = el('button', 'b-ban', 'Bloquear'); bb.onclick = async function(){ if(await bloquear(u.correo, true)) cargarUsuarios(); };
      var bu = el('button', 'b-unban', 'Desbloquear'); bu.onclick = async function(){ if(await bloquear(u.correo, false)) cargarUsuarios(); };
      var bt = el('button', 'b-todo', 'Borrar todo su contenido'); bt.onclick = async function(){ if(await borrarTodo(u.correo)) cargarUsuarios(); };
      ac.appendChild(bb); ac.appendChild(bu); ac.appendChild(bt); card.appendChild(ac);
      $('#lista').appendChild(card);
    });
  }

  /* ---------- pestañas de denuncias ---------- */
  async function contenidoDe(g){
    try{
      if(g.tipo === 'publicacion'){
        var p = await sb.from('publicaciones').select('titulo,descripcion,url_media,correo').eq('id', g.id).maybeSingle();
        return p.data || null;
      }
      var c = await sb.from('comentarios').select('texto,autor,correo').eq('id', g.id).maybeSingle();
      return c.data || null;
    }catch(e){ return null; }
  }
  async function cerrar(g, estado){
    var r = await sb.from('reportes').update({estado: estado}).eq('tipo', g.tipo).eq('objetivo_id', g.id);
    if(r.error){ alert('No se pudo actualizar: ' + r.error.message); return false; }
    return true;
  }
  async function cargar(){
    msg('Cargando…'); $('#lista').textContent = '';
    var q = sb.from('reportes').select('*').order('fecha', {ascending:false}).limit(300);
    if(filtro !== 'todas') q = q.eq('estado', filtro);
    var r = await q;
    if(r.error){ msg('Error: ' + r.error.message); return; }
    var mapa = {};
    (r.data || []).forEach(function(x){
      var k = x.tipo + '|' + x.objetivo_id;
      if(!mapa[k]) mapa[k] = {tipo:x.tipo, id:x.objetivo_id, correo:x.objetivo_correo, motivos:[], n:0, estado:x.estado, fecha:x.fecha};
      mapa[k].n++; mapa[k].motivos.push(x.motivo);
    });
    var grupos = Object.keys(mapa).map(function(k){ return mapa[k]; }).sort(function(a,b){ return b.n - a.n; });
    msg(grupos.length ? '' : 'No hay denuncias en esta vista.');
    for(var i = 0; i < grupos.length; i++) await pintar(grupos[i]);
  }
  async function pintar(g){
    var c = await contenidoDe(g);
    var card = el('div', 'card');
    var top = el('div', 'top');
    top.appendChild(el('span', '', (g.tipo === 'publicacion' ? 'Publicación' : 'Comentario') + ' de ' + (g.correo || '—')));
    var est = el('span', 'badge' + (g.estado === 'accion_tomada' ? ' ok' : g.estado === 'descartada' ? ' no' : ''), g.n + (g.n === 1 ? ' denuncia' : ' denuncias') + ' · ' + g.estado);
    top.appendChild(est); card.appendChild(top);
    card.appendChild(el('div', 'motivos', 'Motivos: ' + g.motivos.filter(function(m, i, a){ return a.indexOf(m) === i; }).join(', ')));

    var box = el('div', 'contenido');
    if(!c){ box.textContent = '(el contenido ya no existe)'; }
    else if(g.tipo === 'publicacion'){
      box.appendChild(el('b', '', c.titulo || '(sin título)'));
      if(c.descripcion) box.appendChild(el('div', '', c.descripcion));
      if(c.url_media){
        if(/\.(jpe?g|png|gif|webp)(\?|$)/i.test(c.url_media)){ var im = el('img'); im.src = c.url_media; im.alt = ''; box.appendChild(im); }
        else { var a = el('a', '', 'Ver archivo / video'); a.href = c.url_media; a.target = '_blank'; a.rel = 'noopener'; box.appendChild(a); }
      }
    } else { box.textContent = c.texto || ''; }
    card.appendChild(box);

    var ac = el('div', 'acciones');
    if(g.estado === 'pendiente'){
      if(c){
        var bb = el('button', 'b-borrar', 'Borrar ' + (g.tipo === 'publicacion' ? 'publicación' : 'comentario'));
        bb.onclick = async function(){
          if(!confirm('¿Borrar este contenido? No se puede deshacer.')) return;
          var r = await sb.rpc(g.tipo === 'publicacion' ? 'admin_borrar_publicacion' : 'admin_borrar_comentario', {p_id: g.id});
          if(r.error){ alert('Error: ' + r.error.message); return; }
          if(await cerrar(g, 'accion_tomada')) cargar();
        };
        ac.appendChild(bb);
      }
      if(g.correo){
        var bu = el('button', 'b-ban', 'Bloquear usuario');
        bu.onclick = async function(){ if(await bloquear(g.correo, true) && await cerrar(g, 'accion_tomada')) cargar(); };
        ac.appendChild(bu);
      }
      var bd = el('button', 'b-desc', 'Descartar');
      bd.onclick = async function(){ if(await cerrar(g, 'descartada')) cargar(); };
      ac.appendChild(bd);
    } else {
      var br = el('button', 'b-reabrir', 'Reabrir denuncia');
      br.onclick = async function(){ if(await cerrar(g, 'pendiente')) cargar(); };
      ac.appendChild(br);
      if(g.correo){
        var bx = el('button', 'b-unban', 'Desbloquear usuario');
        bx.onclick = async function(){ if(await bloquear(g.correo, false)) cargar(); };
        ac.appendChild(bx);
      }
    }
    if(g.correo){
      var bt = el('button', 'b-todo', 'Borrar todo su contenido');
      bt.onclick = async function(){ if(await borrarTodo(g.correo)) cargar(); };
      ac.appendChild(bt);
    }
    card.appendChild(ac);
    $('#lista').appendChild(card);
  }
  init();
})();
</script>
</body>
</html>
